[project]
name = "shoulder-rest"
version = "0.1.0"
description = "Parametric build123d models for a violin shoulder rest"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "build123d>=0.12.0",
]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shoulder_rest"
module-root = "src"
# uv_build includes all files inside the package, including assets/.

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ocp-vscode>=4.1.0",
    "ruff>=0.17.3",
]

[[tool.mypy.overrides]]
module = ["ocp_vscode"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "I001",    # Its one-name-per-line wrapping cannot be configured; keep imports compact and sorted.
    "B008",    # Frozen parameter dataclasses are safe shared defaults.
    "RUF009",  # Same, for dataclass fields.
    "SIM117",  # Nested builder and Locations contexts read better than one long with.
]
